# ==============================================================================
# EvoEdge Experimental Perturbation Distribution Specification (v2.3)
# ==============================================================================
# Resolves experimental split leakage, separates prior diagnostic exposures,
# and declares the genuinely held-out, unexposed final test suite.
#
# Scientific Objective Formal Declaration:
#   OBJECTIVE B: Generalization beyond all previously explored physical ranges.
#   All designated final test dimensions extend strictly beyond the historical
#   exposure ledger:
#     - pole_mass:        0.140 kg (+40%, historically exposed max: 0.130 kg)
#     - cart_mass:        1.40 kg  (+40%, historically exposed max: 1.30 kg)
#     - cart_friction:    0.60 N*s/m      (historically exposed max: 0.50 N*s/m)
#     - joint_friction:   0.015 N*m*s/rad (historically exposed max: 0.010 N*m*s/rad)
#     - obs_noise_sigma:  0.065           (historically exposed max: 0.050)
#     - actuator_delay:   3 steps (60 ms) (historically exposed max: 2 steps / 40 ms)
#
# Partitions:
#   - Training split:                      seeds 0..199
#   - Validation split:                    seeds 200..399
#   - Historical Test split (Comparability): seeds 1000..1099
#   - Supplementary Untouched Test split:   seeds 2000..2099
# ==============================================================================

version: "2.3"
environment: "CartPoleSwingUpEnv"

objective:
  type: "B"
  description: "Generalization beyond all previously explored physical ranges in every designated dimension."

splits:
  training:
    seed_range: [0, 199]
    purpose: "Controller optimization and training rollouts"
  validation:
    seed_range: [200, 399]
    purpose: "Hyperparameter tuning, early stopping, and failure diagnosis"
  test:
    seed_range: [1000, 1099]
    purpose: "Frozen historical benchmark evaluation for direct baseline comparability"
  supplementary_untouched_test:
    seed_range: [2000, 2099]
    purpose: "Protocol Amendment v2.3: Pure untouched final test seeds reserved exclusively for final prospective reporting"

perturbations:
  pole_mass:
    variable_name: "MASS_POLE"
    units: "kg"
    nominal_value: 0.10
    training:
      distribution: "uniform"
      range: [0.08, 0.12]
      description: "Nominal +/- 20% variation"
    validation:
      distribution: "uniform"
      range: [0.075, 0.125]
      description: "Moderate +/- 25% variation (strictly excludes test benchmarks)"
    test:
      distribution: "fixed_and_uniform"
      benchmark_fixed: 0.140
      historical_exposed_fixed: 0.130
      range: [0.05, 0.16]
      rationale: "+40% benchmark condition (0.140 kg) strictly exceeds training max 0.12, validation max 0.125, and historical exposure 0.130"

  cart_mass:
    variable_name: "MASS_CART"
    units: "kg"
    nominal_value: 1.00
    training:
      distribution: "uniform"
      range: [0.85, 1.20]
      description: "Nominal +20% / -15% variation"
    validation:
      distribution: "uniform"
      range: [0.80, 1.25]
      description: "Moderate +25% / -20% variation (strictly excludes test benchmarks)"
    test:
      distribution: "fixed_and_uniform"
      benchmark_fixed: 1.40
      historical_exposed_fixed: 1.30
      range: [0.70, 1.50]
      rationale: "+40% benchmark condition (1.40 kg) strictly exceeds training max 1.20, validation max 1.25, and historical exposure 1.30"

  cart_friction:
    variable_name: "b_cart"
    units: "N*s/m"
    nominal_value: 0.00
    training:
      distribution: "uniform"
      range: [0.00, 0.25]
      description: "Light to moderate rail viscous drag"
    validation:
      distribution: "uniform"
      range: [0.00, 0.35]
      description: "Moderate drag (strictly excludes test benchmarks)"
    test:
      distribution: "fixed"
      benchmark_fixed: 0.60
      historical_exposed_fixed: 0.50
      rationale: "Extreme damping (0.60 N*s/m) strictly exceeds training max 0.25, validation max 0.35, and historical exposure 0.50"

  joint_friction:
    variable_name: "b_pole"
    units: "N*m*s/rad"
    nominal_value: 0.00
    training:
      distribution: "uniform"
      range: [0.00, 0.005]
      description: "Minimal rotational joint friction"
    validation:
      distribution: "uniform"
      range: [0.00, 0.0075]
      description: "Moderate rotational joint friction (strictly excludes test benchmarks)"
    test:
      distribution: "fixed"
      benchmark_fixed: 0.015
      historical_exposed_fixed: 0.010
      rationale: "Extreme joint friction (0.015 N*m*s/rad) strictly exceeds training max 0.005, validation max 0.0075, and historical exposure 0.010"

  observation_noise:
    variable_name: "obs_noise_sigma"
    units: "standard deviation (Gaussian)"
    nominal_value: 0.00
    target_channels:
      - index: 0
        name: "x"
        units: "m"
      - index: 1
        name: "x_dot"
        units: "m/s"
      - index: 2
        name: "cos_theta"
        units: "unitless"
      - index: 3
        name: "sin_theta"
        units: "unitless"
      - index: 4
        name: "theta_dot"
        units: "rad/s"
    training:
      distribution: "uniform"
      range: [0.00, 0.02]
      description: "Low-amplitude sensor noise"
    validation:
      distribution: "uniform"
      range: [0.00, 0.035]
      description: "Medium-amplitude sensor noise (strictly excludes test benchmarks)"
    test:
      distribution: "fixed"
      benchmark_fixed: 0.065
      historical_exposed_fixed: 0.050
      rationale: "Stress noise sigma = 0.065 strictly exceeds training max 0.02, validation max 0.035, and historical exposure 0.050"

  actuator_delay:
    variable_name: "delay_steps"
    units: "discrete control steps (dt = 0.02s)"
    nominal_value: 0
    training:
      distribution: "discrete"
      values: [0]
      description: "Zero-latency ideal actuation during nominal training"
    validation:
      distribution: "discrete"
      values: [0]
      description: "Zero-latency validation during nominal model selection"
    test:
      distribution: "discrete"
      values: [3]
      historical_exposed_values: [1, 2]
      rationale: "3-step (60 ms) delay is genuinely unexposed, strictly exceeding training/validation latency [0] and historical delays [1, 2]"

# ── Prior Exposure & Unexposed Final Test Suites ──────────────────────────────
exposure_catalog:
  previously_exposed_suite:
    description: "Conditions examined during historical handoffs or Phase 1 diagnoses. Ineligible for held-out post-Phase-2 final test."
    conditions:
      - name: "historical_heavy_cart"
        params: { cart_mass: 1.30 }
      - name: "historical_heavy_pole"
        params: { pole_mass: 0.130 }
      - name: "historical_friction"
        params: { cart_friction: 0.50, joint_friction: 0.010 }
      - name: "historical_noise"
        params: { observation_noise: 0.050 }
      - name: "historical_delay_1step"
        params: { actuator_delay: 1 }
      - name: "historical_delay_2step"
        params: { actuator_delay: 2 }
      - name: "historical_combined"
        params: { pole_mass: 0.130, cart_mass: 1.30, cart_friction: 0.50, joint_friction: 0.010, observation_noise: 0.050, actuator_delay: 1 }

  unexposed_final_test_suite:
    description: "Genuinely unseen final evaluation suite under Objective B (exceeding all prior exposure). Must NOT be evaluated during Phase 1 or Phase 2 training/tuning."
    supplementary_untouched_seeds: [2000, 2099]
    conditions:
      - name: "unexposed_heavy_cart"
        params: { cart_mass: 1.40 }
      - name: "unexposed_heavy_pole"
        params: { pole_mass: 0.140 }
      - name: "unexposed_friction"
        params: { cart_friction: 0.60, joint_friction: 0.015 }
      - name: "unexposed_noise"
        params: { observation_noise: 0.065 }
      - name: "unexposed_delay_3step"
        params: { actuator_delay: 3 }
      - name: "unexposed_combined"
        params: { pole_mass: 0.140, cart_mass: 1.40, cart_friction: 0.60, joint_friction: 0.015, observation_noise: 0.065, actuator_delay: 3 }
