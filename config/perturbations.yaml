# ==============================================================================
# EvoEdge Experimental Perturbation Distribution Specification (v2.1)
# ==============================================================================
# Resolves experimental split leakage, separates prior diagnostic exposures,
# and declares the genuinely held-out, unexposed final test suite.
#
# Partitions:
#   - Training split:   seeds 0..199
#   - Validation split: seeds 200..399
#   - Final Test split: seeds 1000..1099
#
# Exposure Separation:
#   Conditions tested during historical handoffs or Phase 1 failure diagnoses
#   (cart_mass=1.30, pole_mass=0.13, friction 0.50/0.010, noise 0.05, delay 1 & 2)
#   are formally cataloged as PREVIOUSLY_EXPOSED in results/perturbation_exposure_ledger.csv.
#   A new GENUINELY UNEXPOSED final benchmark suite is defined below.
# ==============================================================================

version: "2.1"
environment: "CartPoleSwingUpEnv"

splits:
  training:
    seed_range: [0, 199]
    purpose: "Controller optimization and training rollouts"
  validation:
    seed_range: [200, 399]
    purpose: "Hyperparameter tuning, early stopping, and failure diagnosis"
  test:
    seed_range: [1000, 1099]
    purpose: "Frozen final benchmark evaluation and publication reporting"

perturbations:
  pole_mass:
    variable_name: "MASS_POLE"
    units: "kg"
    nominal_value: 0.10
    training:
      distribution: "uniform"
      range: [0.08, 0.12]
      description: "Nominal +/- 20% variation"
    validation:
      distribution: "uniform"
      range: [0.075, 0.125]
      description: "Moderate +/- 25% variation (strictly excludes test benchmarks)"
    test:
      distribution: "fixed_and_uniform"
      benchmark_fixed: 0.135
      historical_exposed_fixed: 0.130
      range: [0.05, 0.15]
      rationale: "+35% benchmark condition (0.135 kg) is genuinely unexposed, strictly outside train [0.08, 0.12] and val [0.075, 0.125]"

  cart_mass:
    variable_name: "MASS_CART"
    units: "kg"
    nominal_value: 1.00
    training:
      distribution: "uniform"
      range: [0.85, 1.20]
      description: "Nominal +20% / -15% variation"
    validation:
      distribution: "uniform"
      range: [0.80, 1.25]
      description: "Moderate +25% / -20% variation (strictly excludes test benchmarks)"
    test:
      distribution: "fixed_and_uniform"
      benchmark_fixed: 1.35
      historical_exposed_fixed: 1.30
      range: [0.70, 1.45]
      rationale: "+35% benchmark condition (1.35 kg) is genuinely unexposed, strictly beyond train [0.85, 1.20] and val [0.80, 1.25]"

  cart_friction:
    variable_name: "b_cart"
    units: "N*s/m"
    nominal_value: 0.00
    training:
      distribution: "uniform"
      range: [0.00, 0.25]
      description: "Light to moderate rail viscous drag"
    validation:
      distribution: "uniform"
      range: [0.00, 0.35]
      description: "Moderate drag (strictly excludes test benchmarks)"
    test:
      distribution: "fixed"
      benchmark_fixed: 0.45
      historical_exposed_fixed: 0.50
      rationale: "Unexposed viscous damping (0.45 N*s/m) tests energy injection starvation strictly beyond 0.25 train limit and 0.35 val limit"

  joint_friction:
    variable_name: "b_pole"
    units: "N*m*s/rad"
    nominal_value: 0.00
    training:
      distribution: "uniform"
      range: [0.00, 0.005]
      description: "Minimal rotational joint friction"
    validation:
      distribution: "uniform"
      range: [0.00, 0.0075]
      description: "Moderate rotational joint friction (strictly excludes test benchmarks)"
    test:
      distribution: "fixed"
      benchmark_fixed: 0.009
      historical_exposed_fixed: 0.010
      rationale: "Unexposed joint friction 0.009 N*m*s/rad tests rotational drag strictly beyond train and val limits"

  observation_noise:
    variable_name: "obs_noise_sigma"
    units: "standard deviation (Gaussian)"
    nominal_value: 0.00
    target_channels:
      - index: 0
        name: "x"
        units: "m"
      - index: 1
        name: "x_dot"
        units: "m/s"
      - index: 2
        name: "cos_theta"
        units: "unitless"
      - index: 3
        name: "sin_theta"
        units: "unitless"
      - index: 4
        name: "theta_dot"
        units: "rad/s"
    training:
      distribution: "uniform"
      range: [0.00, 0.02]
      description: "Low-amplitude sensor noise"
    validation:
      distribution: "uniform"
      range: [0.00, 0.035]
      description: "Medium-amplitude sensor noise (strictly excludes test benchmarks)"
    test:
      distribution: "fixed"
      benchmark_fixed: 0.045
      historical_exposed_fixed: 0.050
      rationale: "Unexposed stress noise sigma = 0.045 is strictly beyond train [0.00, 0.02] and val [0.00, 0.035]"

  actuator_delay:
    variable_name: "delay_steps"
    units: "discrete control steps (dt = 0.02s)"
    nominal_value: 0
    training:
      distribution: "discrete"
      values: [0]
      description: "Zero-latency ideal actuation during nominal training"
    validation:
      distribution: "discrete"
      values: [0]
      description: "Zero-latency validation during nominal model selection"
    test:
      distribution: "discrete"
      values: [3]
      historical_exposed_values: [1, 2]
      rationale: "3-step (60 ms) delay is genuinely unexposed, strictly out-of-distribution relative to train/val [0] and previously explored {1, 2}"

# ── Prior Exposure & Unexposed Final Test Suites ──────────────────────────────
exposure_catalog:
  previously_exposed_suite:
    description: "Conditions examined during historical handoffs or Phase 1 diagnoses. Ineligible for held-out post-Phase-2 final test."
    conditions:
      - name: "historical_heavy_cart"
        params: { cart_mass: 1.30 }
      - name: "historical_heavy_pole"
        params: { pole_mass: 0.130 }
      - name: "historical_friction"
        params: { cart_friction: 0.50, joint_friction: 0.010 }
      - name: "historical_noise"
        params: { observation_noise: 0.050 }
      - name: "historical_delay_1step"
        params: { actuator_delay: 1 }
      - name: "historical_delay_2step"
        params: { actuator_delay: 2 }
      - name: "historical_combined"
        params: { pole_mass: 0.130, cart_mass: 1.30, cart_friction: 0.50, joint_friction: 0.010, observation_noise: 0.050, actuator_delay: 1 }

  unexposed_final_test_suite:
    description: "Genuinely unseen final evaluation suite. Must NOT be evaluated during Phase 1 or controller training/tuning."
    conditions:
      - name: "unexposed_heavy_cart"
        params: { cart_mass: 1.35 }
      - name: "unexposed_heavy_pole"
        params: { pole_mass: 0.135 }
      - name: "unexposed_friction"
        params: { cart_friction: 0.45, joint_friction: 0.009 }
      - name: "unexposed_noise"
        params: { observation_noise: 0.045 }
      - name: "unexposed_delay_3step"
        params: { actuator_delay: 3 }
      - name: "unexposed_combined"
        params: { pole_mass: 0.135, cart_mass: 1.35, cart_friction: 0.45, joint_friction: 0.009, observation_noise: 0.045, actuator_delay: 3 }
